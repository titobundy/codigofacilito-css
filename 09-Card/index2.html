<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card -  Claude IA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }
        
        .card {
            width: 300px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        
        .card-img {
            width: 100%;
            height: 300px;
            background-color: #c92525;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        
        .card-img img {
            width: 90%;
            height: auto;
        }
        
        .card-content {
            padding: 20px;
        }
        
        .card-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .card-text {
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            margin-bottom: 20px;
        }
        
        .card-button {
            background-color: #c92525;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
        }
        
        .card-button:hover {
            background-color: #a51f1f;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-img">
            <img src="img/tenis.jpg" alt="Nike red shoe">
        </div>
        <div class="card-content">
            <h2 class="card-title">Producto #1</h2>
            <p class="card-text">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod, quae repudiandae. Animi, voluptates deleniti laudantium quas placeat eius officia earum amet rerum maiores temporibus explicabo perferendis eaque id sunt? Exercitationem!</p>
            <a href="#" class="card-button">Quiero saber más</a>
        </div>
    </div>
</body>
</html>
